[package]
name = "php2rust-symfony-string"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Port of the symfony/string component"

[dependencies]
getrandom = "0.4"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
php-pcre = { workspace = true }
php-value = { workspace = true }

[dev-dependencies]
php-value = { workspace = true, features = ["vectors"] }
serde_json = "1.0.154"

[lib]
name = "symfony_string"

[lints]
workspace = true
