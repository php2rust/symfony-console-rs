[package]
name = "symfony-string"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Port of the symfony/string component"

[dependencies]
getrandom = "0.4"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
php-pcre = { path = "../php-pcre" }
php-value = { path = "../php-value" }

[dev-dependencies]
php-value = { path = "../php-value", features = ["vectors"] }
serde_json = "1.0.154"
